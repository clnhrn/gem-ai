name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          OPENAI_API_KEY: sk-placeholder
          UPSTASH_VECTOR_REST_URL: https://placeholder.upstash.io
          UPSTASH_VECTOR_REST_TOKEN: placeholder
